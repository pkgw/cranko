[package]
name = "cranko"
version = "0.17.2"
authors = ["Peter Williams <peter@newton.cx>"]
edition = "2018"
license = "MIT"
description = "A cross-platform, cross-language release automation tool"
homepage = "https://pkgw.github.io/cranko/"
documentation = "https://docs.rs/cranko"
repository = "https://github.com/pkgw/cranko"
readme = "README.md"
keywords = ["ci", "cli", "release-automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["book", "ci", "www"]

[dependencies]
anyhow = "^1"
atomicwrites = "^0.4"
base64 = "^0.22"
cargo_metadata = "^0.23"
chrono = "^0.4"
ci_info = "^0.14"
configparser = "^3.0"
dirs = "^6"
dynfmt2 = { version = "^0.3", default-features = false, features = ["curly"] }
flate2 = "^1.0"
git-url-parse = "^0.4"
git2 = "^0.20"
json = "^0.12"
json5 = "^1.3"
lazy_static = "^1.4"
log = "^0.4"
lru = "^0.16"
nom = "^5"
percent-encoding = "^2"
petgraph = "^0.8"
quick-xml = "^0.31"
rand = "^0.8"
reqwest = { version = "^0.13", features = ["blocking"] }
semver = "^1.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
structopt = "^0.3"
tar = "^0.4"
target-lexicon = "^0.13"
termcolor = "^1.1"
terminal_size = "^0.4"
textwrap = "^0.16"
thiserror = "2.0"
toml = "^0.9"
toml_edit = "^0.24"
uuid = { version = "^1.0", features = ["v4"] }
zip = { version = "^7", default-features = false, features = [
  "deflate",
  "time",
] }

[patch.crates-io]
ci_info = { git = "https://github.com/pkgw/ci_info", branch = "github-fix" }

[features]
vendored-openssl = ["git2/vendored-openssl"]
